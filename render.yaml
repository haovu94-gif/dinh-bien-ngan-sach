services:
  - type: web
    name: dinh-bien-ngan-sach
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "khong can build"
    startCommand: node server.js
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: APP_PASSWORD
        sync: false
